<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millers Sales Dashboard 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: #1e2330;
    --accent: #e8b94f;
    --accent2: #4fc3e8;
    --green: #3de87a;
    --red: #e84f4f;
    --text: #f0f2f8;
    --muted: #6b7491;
    --divisions: #e8b94f,#4fc3e8,#3de87a,#e87a4f,#b44fe8,#e84f9a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; font-size:14px; min-height:100vh; }

  /* LOADER */
  #loader {
    position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:1000; gap:16px;
  }
  #loader .logo { font-family:'Barlow Condensed',sans-serif; font-size:32px; font-weight:800; letter-spacing:2px; color:var(--accent); }
  #loader .sub { color:var(--muted); font-size:13px; letter-spacing:3px; text-transform:uppercase; }
  .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loader.hidden { opacity:0; pointer-events:none; transition:opacity .4s; }

  /* HEADER */
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; border-bottom:1px solid var(--border);
    background:var(--surface); position:sticky; top:0; z-index:100;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark { width:36px; height:36px; background:var(--accent); border-radius:6px; display:flex; align-items:center; justify-content:center; }
  .brand-mark svg { width:20px; height:20px; fill:var(--bg); }
  .brand-name { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:800; letter-spacing:1px; }
  .brand-sub { font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  .header-right { display:flex; align-items:center; gap:16px; }
  .last-updated { font-size:11px; color:var(--muted); }
  .refresh-btn {
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    padding:6px 14px; border-radius:6px; font-size:12px; font-family:'Barlow',sans-serif;
    cursor:pointer; letter-spacing:1px; transition:all .2s;
  }
  .refresh-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* NAV TABS */
  .nav-tabs {
    display:flex; gap:0; padding:0 28px;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .tab-btn {
    padding:12px 20px; font-family:'Barlow Condensed',sans-serif; font-size:13px;
    font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    background:none; border:none; border-bottom:2px solid transparent;
    cursor:pointer; transition:all .2s; white-space:nowrap;
  }
  .tab-btn:hover { color:var(--text); }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

  /* MAIN */
  main { padding:24px 28px; max-width:1600px; margin:0 auto; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* SECTION TITLE */
  .section-title {
    font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:600;
    letter-spacing:3px; text-transform:uppercase; color:var(--muted);
    margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--border);
  }

  /* KPI GRID */
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; margin-bottom:28px; }
  .kpi-card {
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:18px 20px; transition:border-color .2s;
  }
  .kpi-card:hover { border-color:var(--accent); }
  .kpi-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .kpi-value { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800; line-height:1; }
  .kpi-sub { font-size:11px; color:var(--muted); margin-top:6px; }
  .kpi-badge {
    display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px;
    font-weight:600; letter-spacing:1px; margin-top:6px;
  }
  .badge-green { background:rgba(61,232,122,.15); color:var(--green); }
  .badge-red { background:rgba(232,79,79,.15); color:var(--red); }
  .badge-yellow { background:rgba(232,185,79,.15); color:var(--accent); }

  /* DIVISION GRID */
  .div-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px; margin-bottom:28px; }
  .div-card {
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:20px; transition:border-color .2s;
  }
  .div-card:hover { border-color:var(--border); }
  .div-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .div-name { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; letter-spacing:1px; }
  .div-color { width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:6px; }
  .div-pct { font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:800; }
  .progress-track { height:4px; background:var(--border); border-radius:2px; margin:8px 0 12px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:2px; transition:width .8s ease; }
  .div-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .div-stat-label { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .div-stat-val { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; margin-top:2px; }

  /* SCORECARD TABLE */
  .scorecard-wrap { overflow-x:auto; margin-bottom:28px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    padding:10px 12px; text-align:left; font-size:10px; letter-spacing:2px;
    text-transform:uppercase; color:var(--muted); font-weight:600;
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody tr { border-bottom:1px solid var(--border); transition:background .15s; }
  tbody tr:hover { background:var(--surface2); }
  tbody tr.total-row { background:var(--surface2); font-weight:600; }
  tbody td { padding:9px 12px; white-space:nowrap; }
  td.num { text-align:right; font-family:'Barlow Condensed',sans-serif; font-size:14px; }
  td.pct-cell { text-align:right; }
  .pct-pill {
    display:inline-block; padding:2px 7px; border-radius:4px; font-size:11px;
    font-weight:600; min-width:44px; text-align:center;
  }
  .pct-0 { background:rgba(232,79,79,.12); color:var(--red); }
  .pct-low { background:rgba(232,185,79,.12); color:var(--accent); }
  .pct-mid { background:rgba(79,195,232,.12); color:var(--accent2); }
  .pct-high { background:rgba(61,232,122,.12); color:var(--green); }
  .pct-fire { background:rgba(61,232,122,.2); color:#aeffca; }

  /* CHARTS GRID */
  .charts-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(460px, 1fr)); gap:16px; margin-bottom:28px; }
  .chart-card {
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:20px;
  }
  .chart-title { font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
  .chart-wrap { position:relative; height:220px; }

  /* DIV SELECTOR */
  .div-selector { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .div-sel-btn {
    padding:6px 14px; border-radius:6px; font-size:12px; font-weight:600;
    letter-spacing:1px; border:1px solid var(--border); background:var(--surface2);
    color:var(--muted); cursor:pointer; transition:all .2s;
  }
  .div-sel-btn.active { color:var(--bg); border-color:transparent; }

  /* RESPONSIVE */
  @media(max-width:640px) {
    header { padding:12px 16px; }
    main { padding:16px; }
    .nav-tabs { padding:0 16px; overflow-x:auto; }
    .kpi-grid { grid-template-columns:repeat(2,1fr); }
    .div-grid { grid-template-columns:1fr; }
    .charts-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="logo">MILLERS PROS GROUP</div>
  <div class="sub">Loading Sales Intelligence</div>
  <div class="spinner"></div>
</div>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 20 20"><path d="M10 2L2 7v6l8 5 8-5V7L10 2zm0 2.5L16 8l-6 3.75L4 8l6-3.5zM3.5 9.2l6 3.75v5.55L3.5 14.75V9.2zm7.5 9.3v-5.55l6-3.75v5.55L11 18.5z"/></svg>
    </div>
    <div>
      <div class="brand-name">MILLERS PROS GROUP</div>
      <div class="brand-sub">Sales Intelligence · 2026</div>
    </div>
  </div>
  <div class="header-right">
    <span class="last-updated" id="last-updated">Loading...</span>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</header>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="showTab('overview')">Overview</button>
  <button class="tab-btn" onclick="showTab('scorecard')">Scorecard</button>
  <button class="tab-btn" onclick="showTab('charts')">Charts</button>
</div>

<main>

  <!-- OVERVIEW TAB -->
  <div class="tab-panel active" id="tab-overview">
    <div class="section-title">YTD Performance Summary</div>
    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="section-title">Division Breakdown</div>
    <div class="div-grid" id="div-grid"></div>
  </div>

  <!-- SCORECARD TAB -->
  <div class="tab-panel" id="tab-scorecard">
    <div class="div-selector" id="score-div-selector"></div>
    <div class="scorecard-wrap" id="scorecard-table"></div>
  </div>

  <!-- CHARTS TAB -->
  <div class="tab-panel" id="tab-charts">
    <div class="div-selector" id="chart-div-selector"></div>
    <div class="charts-grid" id="charts-grid"></div>
  </div>

</main>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTo6J92T-IbwG_HoIgKOG9jf9rH613rs7OdTAQLinGaziV9NrGv_WFdQ7JxVEcEZg/pub?output=csv';

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const DIV_COLORS = {
  'MP Construction': '#e8b94f',
  'MPL Construction': '#4fc3e8',
  'MPC': '#3de87a',
  'MP Maintenance': '#e87a4f',
  'MPL Maintenance': '#b44fe8',
  'RNS': '#e84f9a'
};

let divisionData = {};
let activeScoreDiv = '';
let activeChartDiv = '';
let chartInstances = {};

function parseNum(s) {
  if (!s || s === '—' || s === '' || s === '#REF!') return null;
  return parseFloat(s.replace(/[$,%]/g,'').replace(/,/g,'')) || 0;
}

function parsePct(s) {
  if (!s || s === '—' || s === '') return null;
  return parseFloat(s.replace('%','')) || 0;
}

function fmtMoney(n) {
  if (n === null || n === undefined) return '—';
  if (Math.abs(n) >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + n.toFixed(0);
}

function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  return n % 1 === 0 ? n.toString() : n.toFixed(1);
}

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    const row = [];
    let inQ = false, val = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { row.push(val.trim()); val = ''; }
      else val += c;
    }
    row.push(val.trim());
    rows.push(row);
  }
  return rows;
}

function extractDivisions(rows) {
  // Structure: row1=title, row2=div names (cols 1,9,17), row3=headers, rows 4-15=months, row16=TOTAL
  // Then row17=blank, row18=div names (cols 1,9,17), row19=headers, rows 20-31=months, row32=TOTAL
  const divs = {};

  function extractBlock(nameRow, headerRow, dataStartRow, dataEndRow, cols) {
    const divNames = cols.map(c => (nameRow[c] || '').trim()).filter(Boolean);
    divNames.forEach((name, di) => {
      const col = cols[di];
      divs[name] = { name, months: [], total: null };
      for (let r = dataStartRow; r <= dataEndRow; r++) {
        const row = rows[r] || [];
        const monthLabel = (row[0] || '').trim();
        if (monthLabel === 'TOTAL') {
          divs[name].total = {
            goalU: parseNum(row[col]),
            goalD: parseNum(row[col+1]),
            actual: parseNum(row[col+2]),
            variance: parseNum(row[col+3]),
            pctGoal: parsePct(row[col+4]),
            totalAmt: parseNum(row[col+5])
          };
        } else if (MONTHS.includes(monthLabel)) {
          divs[name].months.push({
            month: monthLabel,
            goalU: parseNum(row[col]),
            goalD: parseNum(row[col+1]),
            actual: parseNum(row[col+2]),
            variance: parseNum(row[col+3]),
            pctGoal: parsePct(row[col+4]),
            totalAmt: parseNum(row[col+5])
          });
        }
      }
    });
  }

  // Block 1: rows index 1=div names, 2=col headers, 3..14=months, 15=TOTAL
  extractBlock(rows[1] || [], rows[2] || [], 3, 15, [1, 9, 17]);
  // Block 2: rows index 17=div names, 18=col headers, 19..30=months, 31=TOTAL
  extractBlock(rows[17] || [], rows[18] || [], 19, 31, [1, 9, 17]);

  return divs;
}

function pctClass(pct) {
  if (pct === null) return 'pct-0';
  if (pct === 0) return 'pct-0';
  if (pct < 50) return 'pct-low';
  if (pct < 100) return 'pct-mid';
  if (pct < 200) return 'pct-high';
  return 'pct-fire';
}

function renderOverview() {
  const names = Object.keys(divisionData);
  let totalGoalU = 0, totalActual = 0, totalGoalD = 0, totalAmt = 0;
  names.forEach(n => {
    const t = divisionData[n].total;
    if (!t) return;
    totalGoalU += t.goalU || 0;
    totalActual += t.actual || 0;
    totalGoalD += t.goalD || 0;
    totalAmt += t.totalAmt || 0;
  });
  const ytdPct = totalGoalU ? ((totalActual / totalGoalU)*100).toFixed(1) : 0;

  // Find best performer (by % to goal, YTD)
  let bestDiv = '', bestPct = -1;
  names.forEach(n => {
    const t = divisionData[n].total;
    if (t && t.pctGoal > bestPct) { bestPct = t.pctGoal; bestDiv = n; }
  });

  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Total Annual Goal</div>
      <div class="kpi-value" style="color:var(--accent)">${fmtMoney(totalGoalD)}</div>
      <div class="kpi-sub">Across ${names.length} divisions</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Deal Goal</div>
      <div class="kpi-value">${fmtNum(totalGoalU)}</div>
      <div class="kpi-sub">Annual units planned</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Actual Deals YTD</div>
      <div class="kpi-value" style="color:var(--green)">${fmtNum(totalActual)}</div>
      <div class="kpi-badge badge-${ytdPct >= 100 ? 'green' : ytdPct >= 50 ? 'yellow' : 'red'}">${ytdPct}% of goal</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">YTD Revenue</div>
      <div class="kpi-value" style="color:var(--accent2)">${fmtMoney(totalAmt)}</div>
      <div class="kpi-sub">All divisions combined</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Best Performer</div>
      <div class="kpi-value" style="color:${DIV_COLORS[bestDiv] || 'var(--accent)'}; font-size:18px">${bestDiv}</div>
      <div class="kpi-badge badge-green">${bestPct}% to goal</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Divisions Tracked</div>
      <div class="kpi-value">${names.length}</div>
      <div class="kpi-sub">Active in 2026</div>
    </div>
  `;

  const divGrid = document.getElementById('div-grid');
  divGrid.innerHTML = names.map(n => {
    const d = divisionData[n];
    const t = d.total || {};
    const pct = t.pctGoal || 0;
    const color = DIV_COLORS[n] || '#888';
    const barW = Math.min(pct, 100);
    return `
      <div class="div-card">
        <div class="div-header">
          <div class="div-name">
            <span class="div-color" style="background:${color}"></span>${n}
          </div>
          <div class="div-pct" style="color:${color}">${pct || 0}%</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${barW}%;background:${color}"></div>
        </div>
        <div class="div-stats">
          <div>
            <div class="div-stat-label">Goal (Units)</div>
            <div class="div-stat-val">${fmtNum(t.goalU)}</div>
          </div>
          <div>
            <div class="div-stat-label">Actual YTD</div>
            <div class="div-stat-val" style="color:${color}">${fmtNum(t.actual)}</div>
          </div>
          <div>
            <div class="div-stat-label">Revenue YTD</div>
            <div class="div-stat-val">${fmtMoney(t.totalAmt)}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderDivSelector(containerId, activeDiv, onSelect) {
  const names = Object.keys(divisionData);
  document.getElementById(containerId).innerHTML = names.map(n => {
    const color = DIV_COLORS[n] || '#888';
    const isActive = n === activeDiv;
    return `<button class="div-sel-btn ${isActive ? 'active' : ''}"
      style="${isActive ? `background:${color};color:#0a0c10` : `border-color:${color}33;color:${color}`}"
      onclick="${onSelect}('${n}')">${n}</button>`;
  }).join('');
}

function renderScorecard(divName) {
  activeScoreDiv = divName;
  renderDivSelector('score-div-selector', divName, 'renderScorecard');
  const d = divisionData[divName];
  if (!d) return;
  const color = DIV_COLORS[divName] || '#888';

  const rows = d.months.map(m => {
    const hasActual = m.actual !== null;
    const pct = m.pctGoal;
    return `<tr>
      <td>${m.month}</td>
      <td class="num">${fmtNum(m.goalU)}</td>
      <td class="num">${fmtMoney(m.goalD)}</td>
      <td class="num" style="color:${hasActual ? color : 'var(--muted)'}">${hasActual ? fmtNum(m.actual) : '—'}</td>
      <td class="num" style="color:${m.variance > 0 ? 'var(--green)' : m.variance < 0 ? 'var(--red)' : 'var(--muted)'}">
        ${m.variance !== null ? (m.variance > 0 ? '+' : '') + fmtNum(m.variance) : '—'}
      </td>
      <td class="pct-cell">
        ${pct !== null ? `<span class="pct-pill ${pctClass(pct)}">${pct}%</span>` : '<span style="color:var(--muted)">—</span>'}
      </td>
      <td class="num">${fmtMoney(m.totalAmt)}</td>
    </tr>`;
  });

  const t = d.total || {};
  const totalPct = t.pctGoal;

  document.getElementById('scorecard-table').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Month</th>
          <th style="text-align:right">Goal (Units)</th>
          <th style="text-align:right">Goal ($)</th>
          <th style="text-align:right">Actual</th>
          <th style="text-align:right">Variance</th>
          <th style="text-align:right">% to Goal</th>
          <th style="text-align:right">Revenue YTD</th>
        </tr>
      </thead>
      <tbody>
        ${rows.join('')}
        <tr class="total-row">
          <td>TOTAL</td>
          <td class="num">${fmtNum(t.goalU)}</td>
          <td class="num">${fmtMoney(t.goalD)}</td>
          <td class="num" style="color:${color}">${fmtNum(t.actual)}</td>
          <td class="num" style="color:${t.variance > 0 ? 'var(--green)' : 'var(--red)'}">
            ${t.variance !== null ? (t.variance > 0 ? '+' : '') + fmtNum(t.variance) : '—'}
          </td>
          <td class="pct-cell">
            ${totalPct !== null ? `<span class="pct-pill ${pctClass(totalPct)}">${totalPct}%</span>` : '—'}
          </td>
          <td class="num">${fmtMoney(t.totalAmt)}</td>
        </tr>
      </tbody>
    </table>
  `;
}

function renderCharts(divName) {
  activeChartDiv = divName;
  renderDivSelector('chart-div-selector', divName, 'renderCharts');
  const d = divisionData[divName];
  if (!d) return;
  const color = DIV_COLORS[divName] || '#888';
  const months = d.months.map(m => m.month);

  // Destroy old charts
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  document.getElementById('charts-grid').innerHTML = `
    <div class="chart-card">
      <div class="chart-title">Monthly Deal Goals vs Actuals</div>
      <div class="chart-wrap"><canvas id="chart-deals"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Monthly Revenue Goals vs Actuals</div>
      <div class="chart-wrap"><canvas id="chart-revenue"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">% to Goal by Month</div>
      <div class="chart-wrap"><canvas id="chart-pct"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Variance (Actual − Goal)</div>
      <div class="chart-wrap"><canvas id="chart-variance"></canvas></div>
    </div>
  `;

  const chartDefaults = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#6b7491', font: { family: 'Barlow', size: 11 } } } },
    scales: {
      x: { ticks: { color: '#6b7491', font: { family: 'Barlow' } }, grid: { color: '#1e2330' } },
      y: { ticks: { color: '#6b7491', font: { family: 'Barlow' } }, grid: { color: '#1e2330' } }
    }
  };

  // Deals chart
  chartInstances.deals = new Chart(document.getElementById('chart-deals'), {
    type: 'bar',
    data: {
      labels: months,
      datasets: [
        {
          label: 'Goal',
          data: d.months.map(m => m.goalU),
          backgroundColor: 'rgba(107,116,145,0.3)',
          borderColor: '#6b7491', borderWidth: 1, borderRadius: 3
        },
        {
          label: 'Actual',
          data: d.months.map(m => m.actual),
          backgroundColor: color + '99',
          borderColor: color, borderWidth: 1, borderRadius: 3
        }
      ]
    },
    options: { ...chartDefaults }
  });

  // Revenue chart
  chartInstances.revenue = new Chart(document.getElementById('chart-revenue'), {
    type: 'bar',
    data: {
      labels: months,
      datasets: [
        {
          label: 'Goal ($)',
          data: d.months.map(m => m.goalD),
          backgroundColor: 'rgba(107,116,145,0.3)',
          borderColor: '#6b7491', borderWidth: 1, borderRadius: 3
        },
        {
          label: 'Actual ($)',
          data: d.months.map(m => m.totalAmt),
          backgroundColor: color + '99',
          borderColor: color, borderWidth: 1, borderRadius: 3
        }
      ]
    },
    options: {
      ...chartDefaults,
      scales: {
        ...chartDefaults.scales,
        y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => '$' + (v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(0)+'K' : v) } }
      }
    }
  });

  // % to goal
  chartInstances.pct = new Chart(document.getElementById('chart-pct'), {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        label: '% to Goal',
        data: d.months.map(m => m.pctGoal),
        borderColor: color, backgroundColor: color + '22',
        tension: 0.3, fill: true, pointBackgroundColor: color, pointRadius: 4
      }, {
        label: '100% Target',
        data: months.map(() => 100),
        borderColor: '#6b7491', borderDash: [4,4], borderWidth: 1,
        pointRadius: 0, fill: false
      }]
    },
    options: {
      ...chartDefaults,
      scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => v + '%' } } }
    }
  });

  // Variance
  const varData = d.months.map(m => m.variance);
  chartInstances.variance = new Chart(document.getElementById('chart-variance'), {
    type: 'bar',
    data: {
      labels: months,
      datasets: [{
        label: 'Variance',
        data: varData,
        backgroundColor: varData.map(v => v === null ? '#1e2330' : v >= 0 ? '#3de87a44' : '#e84f4f44'),
        borderColor: varData.map(v => v === null ? '#1e2330' : v >= 0 ? '#3de87a' : '#e84f4f'),
        borderWidth: 1, borderRadius: 3
      }]
    },
    options: { ...chartDefaults }
  });
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    const text = await res.text();
    const rows = parseCSV(text);
    divisionData = extractDivisions(rows);

    const names = Object.keys(divisionData);
    if (!activeScoreDiv || !divisionData[activeScoreDiv]) activeScoreDiv = names[0];
    if (!activeChartDiv || !divisionData[activeChartDiv]) activeChartDiv = names[0];

    renderOverview();
    renderScorecard(activeScoreDiv);
    renderCharts(activeChartDiv);

    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    document.getElementById('loader').classList.add('hidden');
  } catch (e) {
    document.getElementById('loader').innerHTML = `
      <div class="logo" style="color:var(--red)">Error Loading Data</div>
      <div class="sub">${e.message}</div>
      <button class="refresh-btn" onclick="loadData()">Try Again</button>
    `;
  }
}

function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
}

loadData();
</script>
</body>
</html>
